name: GEH Serbia | V23 Energy Intelligence

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions scheduled runs are best-effort, not precise timers.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: geh-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify V23 project files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            scripts/build-v19-site.py \
            scripts/test-v152.mjs \
            scripts/test-v19.mjs \
            scripts/test-v20.mjs \
            scripts/test-v22.mjs \
            scripts/test-v23-gt01.mjs \
            scripts/fetch-energy.mjs \
            scripts/validate-v18-snapshots.mjs \
            scripts/build-pages.mjs \
            assets/js/te-to-gt01-pilot.mjs \
            assets/css/te-to-gt01-pilot.css \
            assets/img/gt01-pilot/gt01-shell.webp \
            assets/img/gt01-pilot/gt01-exposed.webp \
            assets/img/gt01-pilot/gt01-inner.webp; do
            test -f "$file" || { echo "::error file=$file::V23 file missing"; exit 1; }
          done

      - name: Generate monitor pages in four languages
        run: python3 scripts/build-v19-site.py

      - name: V15.2/V19/V20/V22/V23 regression checks
        run: |
          set -euo pipefail
          node scripts/test-v152.mjs
          node scripts/test-v19.mjs
          node scripts/test-v20.mjs
          node scripts/test-v22.mjs
          node scripts/test-v23-gt01.mjs

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/js/energy-model-v18.mjs
          node --check assets/js/energy-app-v19.mjs
          node --check assets/js/te-to-gt01-pilot.mjs
          node --check scripts/fetch-energy.mjs

      - name: Fetch permitted public energy data
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          ENTSOE_PUBLIC_REUSE_APPROVED: ${{ vars.ENTSOE_PUBLIC_REUSE_APPROVED }}
        run: node scripts/fetch-energy.mjs

      - name: Validate published snapshot contract
        run: node scripts/validate-v18-snapshots.mjs

      - name: Build GitHub Pages website
        run: node scripts/build-pages.mjs

      - name: Check V23 appears in deployed static files
        shell: bash
        run: |
          set -euo pipefail
          for lang in sr-lat sr-cyr en ru; do
            grep -q 'id="v23-gt01-pilot"' "dist/$lang/energetski-monitor.html" || { echo "::error::No V23 explorer in $lang"; exit 1; }
          done
          for mode in shell exposed inner; do
            test -s "dist/assets/img/gt01-pilot/gt01-${mode}.webp" || { echo "::error::Missing ${mode} image in dist"; exit 1; }
          done
          test -s dist/assets/js/te-to-gt01-pilot.mjs
          test -s dist/assets/css/te-to-gt01-pilot.css

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
