          node scripts/test-v22.mjs
          node scripts/test-v23-gt01.mjs

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/js/energy-model-v18.mjs
          node --check assets/js/energy-app-v19.mjs
          node --check assets/js/te-to-gt01-pilot.mjs
          node --check scripts/fetch-energy.mjs

      - name: Fetch permitted public energy data
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          ENTSOE_PUBLIC_REUSE_APPROVED: ${{ vars.ENTSOE_PUBLIC_REUSE_APPROVED }}
        run: node scripts/fetch-energy.mjs

      - name: Validate published snapshot contract
        run: node scripts/validate-v18-snapshots.mjs

      - name: Build GitHub Pages website
        run: node scripts/build-pages.mjs

      - name: Check V23 appears in deployed static files
        shell: bash
        run: |
          set -euo pipefail
          for lang in sr-lat sr-cyr en ru; do
            grep -q 'id="v23-gt01-pilot"' "dist/$lang/energetski-monitor.html" || { echo "::error::No V23 explorer in $lang"; exit 1; }
          done
          for mode in shell exposed inner; do
            test -s "dist/assets/img/gt01-pilot/gt01-${mode}.webp" || { echo "::error::Missing ${mode} image in dist"; exit 1; }
          done
          test -s dist/assets/js/te-to-gt01-pilot.mjs
          test -s dist/assets/css/te-to-gt01-pilot.css

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
